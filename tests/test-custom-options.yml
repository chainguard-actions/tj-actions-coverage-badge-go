name: Test coverage badge with custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.21'

      - name: Create coverage.out file with high coverage
        run: |
          cat > coverage.out << 'EOF'
          mode: atomic
          github.com/example/mypackage/main.go:10.13,12.2 1 1
          github.com/example/mypackage/main.go:14.13,16.2 1 1
          github.com/example/mypackage/main.go:18.13,20.2 1 1
          github.com/example/mypackage/main.go:22.13,24.2 1 1
          github.com/example/mypackage/main.go:26.13,28.2 1 1
          EOF

      - name: Create custom target file with badge placeholder
        run: |
          cat > COVERAGE.md << 'EOF'
          # Coverage Report

          ![Go Coverage](https://img.shields.io/badge/Go%20Coverage-0%25-red)

          ## Details
          EOF

      - id: action
        uses: .
        with:
          filename: coverage.out
          target: COVERAGE.md
          text: "Go Coverage"
          color: green
          link: "https://github.com/example/myproject/actions"

      - name: Assert COVERAGE.md was updated with badge
        run: |
          echo "COVERAGE.md contents:"
          cat COVERAGE.md
          if ! grep -q "Go Coverage" COVERAGE.md; then
            echo "FAIL: COVERAGE.md does not contain 'Go Coverage' text"
            exit 1
          fi
          if ! grep -q "img.shields.io" COVERAGE.md; then
            echo "FAIL: COVERAGE.md does not contain shields.io badge URL"
            exit 1
          fi
          echo "PASS: COVERAGE.md contains custom coverage badge"
