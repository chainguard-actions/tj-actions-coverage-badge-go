name: Test optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.21'

      - name: Create coverage.out file
        run: |
          cat > /tmp/coverage-optional.out << 'EOF'
          mode: atomic
          github.com/example/repo/main.go:10.13,12.2 1 8
          github.com/example/repo/main.go:14.13,16.2 1 4
          github.com/example/repo/util.go:5.13,10.2 1 2
          EOF

      - name: Create target README file
        run: |
          cat > /tmp/COVERAGE.md << 'EOF'
          # Coverage Report

          ![Test Coverage](https://img.shields.io/badge/Test%20Coverage-0%25-red)

          ## Details
          EOF

      - id: action
        uses: .
        with:
          filename: /tmp/coverage-optional.out
          color: green
          green: '60'
          yellow: '30'
          target: /tmp/COVERAGE.md
          text: Test Coverage
          value: '85%'
          link: https://github.com/example/repo

      - name: Assert target file was updated
        run: |
          echo "Target file contents:"
          cat /tmp/COVERAGE.md
          if ! grep -q "Coverage" /tmp/COVERAGE.md; then
            echo "FAIL: target file does not contain Coverage badge"
            exit 1
          fi
          echo "PASS"
