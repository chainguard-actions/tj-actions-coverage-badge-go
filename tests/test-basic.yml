name: Test basic coverage badge generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.21'

      - name: Create coverage.out file
        run: |
          cat > coverage.out << 'EOF'
          mode: atomic
          github.com/example/mypackage/main.go:10.13,12.2 1 1
          github.com/example/mypackage/main.go:14.13,16.2 1 1
          github.com/example/mypackage/main.go:18.13,20.2 1 0
          github.com/example/mypackage/main.go:22.13,24.2 1 1
          EOF

      - name: Create README.md with badge placeholder
        run: |
          cat > README.md << 'EOF'
          # My Project

          ![Coverage](https://img.shields.io/badge/Coverage-0%25-red)

          ## Description
          This is my project.
          EOF

      - id: action
        uses: .
        with:
          filename: coverage.out

      - name: Assert README.md was updated with coverage badge
        run: |
          echo "README.md contents:"
          cat README.md
          if ! grep -q "Coverage" README.md; then
            echo "FAIL: README.md does not contain Coverage badge"
            exit 1
          fi
          if ! grep -q "img.shields.io" README.md; then
            echo "FAIL: README.md does not contain shields.io badge URL"
            exit 1
          fi
          echo "PASS: README.md contains coverage badge"
