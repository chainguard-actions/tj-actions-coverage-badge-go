name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.21'

      - name: Create coverage.out file
        run: |
          cat > /tmp/coverage.out << 'EOF'
          mode: atomic
          github.com/example/repo/main.go:10.13,12.2 1 5
          github.com/example/repo/main.go:14.13,16.2 1 3
          EOF

      - name: Create README.md for badge update
        run: |
          cat > /tmp/README.md << 'EOF'
          # My Project

          ![Coverage](https://img.shields.io/badge/Coverage-0%25-red)

          ## Description
          EOF

      - id: action
        uses: .
        with:
          filename: /tmp/coverage.out
          target: /tmp/README.md

      - name: Assert README was updated with badge
        run: |
          echo "README contents:"
          cat /tmp/README.md
          if ! grep -q "Coverage" /tmp/README.md; then
            echo "FAIL: README.md does not contain Coverage badge"
            exit 1
          fi
          echo "PASS"
